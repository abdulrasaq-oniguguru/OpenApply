[project]
name = "openapply"
version = "0.1.0"
description = "Local-first AI job application assistant that uses the AI tools you already have."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["jobs", "job-application", "automation", "llm", "local-first", "playwright"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]
dependencies = [
    "typer>=0.12",
    "click>=8.1",
    "defusedxml>=0.7",
    "pydantic>=2.7",
    "rich>=13.7",
    "httpx>=0.27",
    "platformdirs>=4.2",
    "pypdf>=5.9",
    "python-docx>=1.1",
    "tomli-w>=1.0",
    "playwright>=1.63.0",
    "tzdata>=2025.2; platform_system == 'Windows'",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "uvicorn>=0.34",
]

[project.scripts]
openapply = "openapply.cli.app:main"

[project.urls]
Homepage = "https://github.com/abdulrasaq-oniguguru/OpenApply"
Issues = "https://github.com/abdulrasaq-oniguguru/OpenApply/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-defusedxml>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openapply"]

[tool.hatch.build.targets.wheel.force-include]
"src/openapply/web/templates" = "openapply/web/templates"
"src/openapply/web/static" = "openapply/web/static"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "S", "RUF"]
ignore = ["S101", "ASYNC109"]  # ASYNC109: `timeout` is part of the provider interface

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]
"src/openapply/providers/_process.py" = ["S603"]
"src/openapply/providers/*.py" = ["S603"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
