<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Join us</title></head>
<body>
  <h1>Tell us about yourself</h1>
  <form id="apply" action="/submit" method="post">
    <p><label for="f1">Name</label> <input id="f1" name="f1" type="text"></p>

    <p><input name="f2" type="text" placeholder="Your best email"></p>

    <p>Anything else?<br><input name="q_4821" type="text"></p>

    <p><label for="f4">Contact</label>
       <input id="f4" name="f4" type="text" placeholder="phone or email"></p>

    <p><label for="f5">Link</label> <input id="f5" name="f5" type="text"></p>

    <p><input name="f6" type="text" aria-label="Mobile"></p>

    <p><label for="f7">Location</label>
       <select id="f7" name="f7">
         <option value="">-</option>
         <option value="abj">Abuja</option>
         <option value="lag">Lagos</option>
         <option value="nbo">Nairobi</option>
       </select></p>

    <p><label for="f8">Company</label> <input id="f8" name="f8" type="text"></p>

    <p><label for="f9">Emergency contact phone</label> <input id="f9" name="f9" type="tel"></p>
    <p><label for="f10">Reference email</label> <input id="f10" name="f10" type="email"></p>

    <p><label for="f11">Date</label> <input id="f11" name="f11" type="date"></p>

    <p><input name="f12" type="file"></p>

    <div class="q">
      <p>Are you eligible to work here?</p>
      <div><label><input type="radio" name="eligible" value="y"> Yes</label>
           <label><input type="radio" name="eligible" value="n"> No</label></div>
    </div>

    <p><label for="f14">Anything you would like to add?</label>
       <textarea id="f14" name="f14"></textarea></p>

    <button type="submit">Send</button>
  </form>
</body>
</html>
