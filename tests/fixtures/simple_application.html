<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Apply - Backend Engineer</title></head>
<body>
  <h1>Backend Engineer at Example Corp</h1>
  <p>We build payment APIs. Apply below.</p>

  <form id="apply" action="/submit" method="post" enctype="multipart/form-data">
    <p><label for="first_name">First name *</label>
       <input id="first_name" name="first_name" type="text" required></p>
    <p><label for="last_name">Last name *</label>
       <input id="last_name" name="last_name" type="text" required></p>
    <p><label for="email">Email address *</label>
       <input id="email" name="email" type="email" required></p>
    <p><label for="phone">Phone</label>
       <input id="phone" name="phone" type="tel"></p>
    <p><label for="city">City</label>
       <input id="city" name="city" type="text"></p>
    <p><label for="country">Country *</label>
       <select id="country" name="country" required>
         <option value="">Select...</option>
         <option value="US">United States</option>
         <option value="NG">Nigeria</option>
         <option value="GH">Ghana</option>
       </select></p>
    <p><label for="linkedin">LinkedIn URL</label>
       <input id="linkedin" name="linkedin" type="url"></p>
    <p><label for="resume">Resume/CV *</label>
       <input id="resume" name="resume" type="file" accept=".pdf,.docx" required></p>
    <p><label for="why">Why are you interested in this role? *</label>
       <textarea id="why" name="why" maxlength="500" required></textarea></p>
    <button type="submit">Submit application</button>
  </form>
</body>
</html>
